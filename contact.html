<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="nav.css">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/icon-180.png">
    <!-- 链接预览（Open Graph）。og:image 必须是完整网址，抓取器不会帮你补域名 -->
    <meta property="og:title" content="Contact · Web Tech 2026">
    <meta property="og:description" content="How to get in touch.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://matchman1.github.io/BiUH-web-tech-early/contact.html">
    <meta property="og:image" content="https://matchman1.github.io/BiUH-web-tech-early/images/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Web Tech 2026">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>

    <!-- 导航由 parts.js 把 nav.html 的内容填进这里，所以这里是空的 -->
    <header id="site-header"></header>

    <main class="contact-wrap">

        <header class="contact-head">
            <p class="contact-eyebrow">Contact</p>
            <h1>Say hello</h1>
            <p class="contact-sub">有想法、有问题，或者只是想打个招呼，都可以写信给我。</p>
        </header>

        <ul class="contact-list">
            <li>
                <span class="contact-key">Email</span>
                <a class="contact-value" href="mailto:hello@example.com">hello@example.com</a>
            </li>
            <li>
                <span class="contact-key">GitHub</span>
                <a class="contact-value" href="https://github.com/matchman1" target="_blank" rel="noopener">github.com/matchman1</a>
            </li>
            <li>
                <span class="contact-key">Location</span>
                <span class="contact-value">Beijing, China</span>
            </li>
        </ul>

        <footer class="contact-foot">
            <a class="back-link" href="index.html">← Back home</a>
        </footer>

    </main>

    <!-- 页脚由 parts.js 把 footer.html 的内容填进这里，所以这里是空的 -->
    <footer id="site-footer"></footer>

    <!-- 放在 </body> 前：此时两个空元素都已存在，脚本才找得到它们 -->
    <script src="parts.js"></script>
</body>
</html>
